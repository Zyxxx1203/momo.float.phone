plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）；
// 没有配置时 release 构建产出未签名 APK，debug 构建始终可直接安装测试。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def siteUrl = (System.getenv("SHELL_SITE_URL") ?: "https://example.invalid").replaceAll('/+$', '')

android {
    namespace 'app.floatphone.shell'
    compileSdk 34

    defaultConfig {
        applicationId "app.floatphone.shell"
        minSdk 26
        targetSdk 34
        // versionCode 必须严格递增，否则 Android 拒绝覆盖安装（表现为「应用未安装」）。
        // 1.0.4：通话浮窗 + 无障碍服务；1.0.5：浮窗预热与计时修正。
        // 1.0.6：浮窗显隐改由 Activity 生命周期直接驱动（修「退出去不弹」）。
        versionCode 5
        versionName "1.0.6"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("SHELL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHELL_KEY_ALIAS")
                keyPassword System.getenv("SHELL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
        debug {
            // 有固定签名时 debug 也用同一把钥匙。
            // CI 每次构建都是全新容器，自动生成的 debug 密钥每次都不同——
            // 签名一变就只能卸载重装，App 数据（WebView 沙盒里的聊天记录、
            // 角色卡）会一起丢。统一签名后 debug / release 两个包可以互相
            // 覆盖安装，选哪个都不会再触发「应用未安装」。
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
